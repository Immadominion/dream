name: Dream — Shorebird Release

on:
    workflow_dispatch:
        inputs:
            platform:
                description: "Target platform"
                required: true
                default: android
                type: choice
                options:
                    - android
                    - ios

jobs:
    release:
        name: Build & publish release (${{ github.event.inputs.platform }})
        runs-on: ${{ github.event.inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java (Android only)
              if: ${{ github.event.inputs.platform == 'android' }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.44.0"
                  channel: stable

            - name: Install Shorebird CLI
              uses: shorebirdtech/setup-shorebird@v1
              with:
                  cache: true

            - name: Get Flutter dependencies
              run: flutter pub get

            - name: Create .env
              run: echo "${{ secrets.DREAM_ENV }}" > .env

            # ── Android ──────────────────────────────────────────────────────────────
            - name: Shorebird release (Android)
              if: ${{ github.event.inputs.platform == 'android' }}
              run: shorebird release android --artifact apk
              env:
                  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

            - name: Upload Android artifacts
              if: ${{ github.event.inputs.platform == 'android' }}
              uses: actions/upload-artifact@v4
              with:
                  name: dream-android-release
                  path: |
                      build/app/outputs/bundle/release/app-release.aab
                      build/app/outputs/flutter-apk/app-release.apk

            # ── iOS ──────────────────────────────────────────────────────────────────
            - name: Shorebird release (iOS)
              if: ${{ github.event.inputs.platform == 'ios' }}
              run: shorebird release ios --export-method ad-hoc
              env:
                  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

            - name: Upload iOS artifacts
              if: ${{ github.event.inputs.platform == 'ios' }}
              uses: actions/upload-artifact@v4
              with:
                  name: dream-ios-release
                  path: build/ios/archive/Runner.xcarchive
